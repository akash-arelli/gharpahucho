spring:
  datasource:
    url: jdbc:h2:mem:gharpahucho_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
management:
  otlp:
    tracing:
      export:
        enabled: false
gharpahucho:
  demo:
    enabled: true
  maps:
    # Tests never hit the public OSRM server; the haversine fallback is exercised instead.
    osrm-base-url: http://127.0.0.1:1
    nominatim-enabled: false
  flagsmith:
    server-key: ""
  sarvam:
    api-key: ""
  nudgebee:
    monitor-enabled: false
