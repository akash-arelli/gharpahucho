# "demo" profile: what a hosted demo runs. In-memory H2 in PostgreSQL mode, seeded demo travellers, resets on restart.
# Everything else (Flagsmith, Sarvam, NudgeBee, secrets) comes from environment variables.
spring:
  datasource:
    url: jdbc:h2:mem:gharpahucho;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
