# Local self-hosted Flagsmith (API + dashboard on http://localhost:8000).
#   docker compose -f docker-compose.flagsmith.yml up -d
services:
  flagsmith-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_USER: flagsmith
      POSTGRES_PASSWORD: flagsmith
    volumes:
      - flagsmith-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagsmith -d flagsmith"]
      interval: 5s
      timeout: 3s
      retries: 20

  flagsmith:
    image: flagsmith/flagsmith:latest
    depends_on:
      flagsmith-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flagsmith:flagsmith@flagsmith-db:5432/flagsmith
      DJANGO_ALLOWED_HOSTS: "*"
      ALLOW_REGISTRATION_WITHOUT_INVITE: "True"
      ENABLE_ADMIN_ACCESS_USER_PASS: "True"
    ports:
      - "8000:8000"

volumes:
  flagsmith-pgdata:
