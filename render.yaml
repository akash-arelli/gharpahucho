services:
  - type: web
    name: gharpahucho
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: GP_ENVIRONMENT
        value: demo
      - key: GP_DEMO_RESET_ENDPOINT
        value: "true"   # enables one-click demo login (and demo data reset); data is throwaway
      - key: GP_JWT_SECRET
        generateValue: true
      - key: GP_ALLOWED_ORIGINS
        value: https://gharpahucho.onrender.com
      - key: SARVAM_API_KEY
        sync: false
      - key: NUDGEBEE_EVENT_WEBHOOK_URL
        sync: false
